<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Lost Gravity</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .button {
      display: inline-block;
      padding: 10px 18px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.85;
    }

    .pdf-container {
      flex: 1;
      width: 100%;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 75px);
      border: none;
      background: white;
    }

    .fallback {
      padding: 30px;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <h1>The Lost Gravity</h1>

    <a
      class="button"
      href="YOUR-PDF-FILE.pdf"
      target="_blank"
    >
      Open PDF
    </a>
  </header>

  <div class="pdf-container">

    <iframe
      src="YOUR-PDF-FILE.pdf"
      title="The Lost Gravity PDF"
    >
      <div class="fallback">
        Your browser cannot display PDFs.
        <a href="YOUR-PDF-FILE.pdf">Click here to open the PDF.</a>
      </div>
    </iframe>

  </div>

</body>
</html>
